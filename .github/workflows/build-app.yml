name: Build VPN Guard (Windows)
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["claude/**"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller
      - name: Build single exe
        working-directory: vpn-guard
        run: pyinstaller --noconfirm --onefile --windowed --name "VPN Guard" vpn_guard.py
      - uses: actions/upload-artifact@v4
        with:
          name: VPN-Guard-Windows
          path: vpn-guard/dist/VPN Guard.exe
