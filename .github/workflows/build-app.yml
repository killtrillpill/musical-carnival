name: Build VPN Guard (Windows)
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["claude/**"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble portable folder (official Python + script, no packed exe)
        shell: pwsh
        run: |
          $d = "VPN-Guard"
          New-Item -ItemType Directory -Force "$d/python","$d/app" | Out-Null
          Invoke-WebRequest "https://www.python.org/ftp/python/3.12.8/python-3.12.8-embed-amd64.zip" -OutFile py.zip
          Expand-Archive py.zip "$d/python"
          Copy-Item vpn-guard/vpn_guard.py "$d/app/"
          Set-Content "$d/Запустить VPN Guard.bat" -Encoding ASCII -Value '@echo off', 'cd /d "%~dp0"', 'start "" "python\pythonw.exe" "app\vpn_guard.py"'
          Set-Content "$d/Диагностика.bat" -Encoding ASCII -Value '@echo off', 'cd /d "%~dp0"', 'python\python.exe app\vpn_guard.py --diagnose', 'pause'
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 64,64
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = 'AntiAlias'
          $g.Clear([System.Drawing.Color]::Transparent)
          $g.FillEllipse((New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(36,87,214))), 2,2,60,60)
          $pen = New-Object System.Drawing.Pen ([System.Drawing.Color]::White), 7
          $pen.StartCap = 'Round'; $pen.EndCap = 'Round'; $pen.LineJoin = 'Round'
          $g.DrawLines($pen, [System.Drawing.Point[]]@((New-Object System.Drawing.Point 18,33), (New-Object System.Drawing.Point 28,43), (New-Object System.Drawing.Point 46,21)))
          $ico = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $fs = [IO.File]::Create("$PWD/$d/app/icon.ico"); $ico.Save($fs); $fs.Close()
          $ps1 = @'
          $root = Split-Path -Parent $PSScriptRoot
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'VPN Guard.lnk'
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          $s.TargetPath = "$root\python\pythonw.exe"
          $s.Arguments = '"' + "$root\app\vpn_guard.py" + '"'
          $s.WorkingDirectory = $root
          $s.IconLocation = "$root\app\icon.ico"
          $s.Description = 'VPN Guard'
          $s.Save()
          '@
          Set-Content "$d/app/make-shortcut.ps1" -Value ($ps1 -replace '(?m)^ {10}','') -Encoding UTF8
          Set-Content "$d/Создать ярлык на рабочем столе.bat" -Encoding ASCII -Value '@echo off','powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0app\make-shortcut.ps1"','echo Shortcut VPN Guard created on Desktop.','pause'
          if (-not (Test-Path "$d/app/icon.ico")) { exit 1 }
          & "$d/python/python.exe" "$d/app/vpn_guard.py" --diagnose | Select-Object -First 5
      - name: Smoke test (start like a user would, hit the API)
        shell: pwsh
        timeout-minutes: 4
        run: |
          $env:VPN_GUARD_HOME = "$PWD\smoke"
          $env:VPN_GUARD_TRACE = "10"
          $p = Start-Process "VPN-Guard/python/pythonw.exe" -ArgumentList "VPN-Guard/app/vpn_guard.py","--no-browser","--port","47888" -PassThru
          $sw = [Diagnostics.Stopwatch]::StartNew()
          do { Start-Sleep -Milliseconds 300; try { Invoke-RestMethod 'http://127.0.0.1:47888/api/ping' -TimeoutSec 3 | Out-Null; $up = $true } catch { $up = $false } } until ($up -or $sw.Elapsed.TotalSeconds -gt 20)
          "server up: $up after $($sw.Elapsed.TotalSeconds) s"
          if ($p.HasExited) { Write-Host "pythonw EXITED code $($p.ExitCode)"; if (Test-Path smoke/crash.log) { Get-Content smoke/crash.log }; exit 1 }
          $tok = (Get-Content smoke/token).Trim()
          $h = @{ "X-Token" = $tok }
          if (-not $up) { Start-Sleep 3; "--- trace ---"; if (Test-Path smoke/trace.txt) { Get-Content smoke/trace.txt }; "--- crash ---"; if (Test-Path smoke/crash.log) { Get-Content smoke/crash.log }; Stop-Process $p; exit 1 }
          $st = Invoke-RestMethod "http://127.0.0.1:47888/api/state" -Headers $h -TimeoutSec 20
          "status: $($st.status.status) first_run: $($st.first_run)"
          $r = Invoke-RestMethod "http://127.0.0.1:47888/api/selftest" -Method Post -Headers $h -ContentType "application/json" -Body "{}" -TimeoutSec 40
          $r.checks | ForEach-Object { "$($_.ok) | $($_.title) | $($_.detail)" }
          $pr = Invoke-RestMethod "http://127.0.0.1:47888/api/processes" -Headers $h -TimeoutSec 20
          "processes: $($pr.names.Count)"
          # --- боевой тест: блокнот должен закрыться, потому что VPN-программы нет ---
          $post = { param($b) Invoke-RestMethod "http://127.0.0.1:47888/api/config" -Method Post -Headers $h -ContentType "application/json" -Body ($b | ConvertTo-Json -Depth 5) -TimeoutSec 20 }
          $np = Start-Process notepad.exe -PassThru
          Start-Sleep 2
          "notepad alive before: $(-not $np.HasExited)"
          & $post @{ apps = @("notepad"); vpn = @{ process = "NoSuchVpnApp"; mode = "auto"; check = $true }; limits = @{ check_internet = $false; retries = 1; retry_delay_ms = 200 } } | Out-Null
          & $post @{ enabled = $true } | Out-Null
          Start-Sleep 6
          $np.Refresh()
          "notepad killed by guard: $($np.HasExited)"
          $st2 = Invoke-RestMethod "http://127.0.0.1:47888/api/state" -Headers $h -TimeoutSec 20
          "state: $($st2.status.status) | reason: $($st2.status.reason) | last_kill: $($st2.status.last_kill)"
          $st2.events | ForEach-Object { "log: $($_.t) $($_.msg)" }
          Stop-Process $p -ErrorAction SilentlyContinue
          if (-not $np.HasExited) { Stop-Process $np; Write-Host "FAIL: notepad was NOT closed"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: VPN-Guard-Windows
          path: VPN-Guard
      - name: Test the repo launcher VPN-Guard.bat (what a user who downloads the repo zip runs)
        shell: pwsh
        timeout-minutes: 3
        run: |
          $env:VPN_GUARD_HOME = "$PWD\smoke2"
          $p = Start-Process cmd.exe -ArgumentList '/c','vpn-guard\VPN-Guard.bat' -PassThru -RedirectStandardOutput bat.out -RedirectStandardError bat.err -WindowStyle Hidden
          $sw = [Diagnostics.Stopwatch]::StartNew(); $up = $false
          do { Start-Sleep -Milliseconds 500; try { Invoke-RestMethod 'http://127.0.0.1:47831/api/ping' -TimeoutSec 3 | Out-Null; $up = $true } catch {} } until ($up -or $sw.Elapsed.TotalSeconds -gt 30)
          "bat launcher: server up = $up after $($sw.Elapsed.TotalSeconds) s"
          "--- bat output ---"; Get-Content bat.out -ErrorAction SilentlyContinue; Get-Content bat.err -ErrorAction SilentlyContinue
          Get-Process python* -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $up) { exit 1 }
      - name: Click every panel button via API on Windows, check the app survives
        shell: pwsh
        timeout-minutes: 4
        run: |
          $env:VPN_GUARD_HOME = "$PWD\smoke3"
          $p = Start-Process "VPN-Guard/python/pythonw.exe" -ArgumentList "VPN-Guard/app/vpn_guard.py","--no-browser","--port","47777" -PassThru
          $sw = [Diagnostics.Stopwatch]::StartNew(); $up = $false
          do { Start-Sleep -Milliseconds 400; try { Invoke-RestMethod 'http://127.0.0.1:47777/api/ping' -TimeoutSec 3 | Out-Null; $up = $true } catch {} } until ($up -or $sw.Elapsed.TotalSeconds -gt 20)
          $h = @{ "X-Token" = (Get-Content smoke3/token).Trim() }
          $base = "http://127.0.0.1:47777"
          function Alive { try { Invoke-RestMethod "$base/api/ping" -TimeoutSec 5 | Out-Null; "alive" } catch { "DEAD" } }
          $steps = @(
            @("state","GET","/api/state",$null), @("processes","GET","/api/processes",$null), @("processes all","GET","/api/processes?all=1",$null),
            @("diagnose","GET","/api/diagnose",$null), @("calibrate","POST","/api/calibrate","{}"), @("selftest","POST","/api/selftest","{}"),
            @("autostart on","POST","/api/autostart",'{"on":true}'), @("autostart off","POST","/api/autostart",'{"on":false}'),
            @("enable","POST","/api/config",'{"enabled":true}'), @("disable","POST","/api/config",'{"enabled":false}')
          )
          $bad = 0
          foreach ($s in $steps) {
            try {
              if ($s[1] -eq "GET") { $r = Invoke-RestMethod ($base + $s[2]) -Headers $h -TimeoutSec 40 }
              else { $r = Invoke-RestMethod ($base + $s[2]) -Method Post -Headers $h -ContentType "application/json" -Body $s[3] -TimeoutSec 40 }
              $res = "ok"
            } catch { $res = "ERROR: $($_.Exception.Message)"; $bad++ }
            "$($s[0]): $res | app $(Alive)"
          }
          Get-Process pythonw -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path smoke3/crash.log) { Get-Content smoke3/crash.log }
          if ($bad -gt 0) { exit 1 }
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 64,64
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = 'AntiAlias'; $g.Clear([System.Drawing.Color]::Transparent)
          $g.FillEllipse((New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(36,87,214))), 2,2,60,60)
          $pen = New-Object System.Drawing.Pen ([System.Drawing.Color]::White), 7
          $pen.StartCap = 'Round'; $pen.EndCap = 'Round'; $pen.LineJoin = 'Round'
          $g.DrawLines($pen, [System.Drawing.Point[]]@((New-Object System.Drawing.Point 18,33), (New-Object System.Drawing.Point 28,43), (New-Object System.Drawing.Point 46,21)))
          $ico = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $fs = [IO.File]::Create("$PWD/icon.ico"); $ico.Save($fs); $fs.Close()
      - name: Compile with Nuitka (real compiled exe, not a packed archive)
        run: |
          pip install nuitka ordered-set zstandard
          python -m nuitka --standalone --assume-yes-for-downloads --windows-console-mode=disable --windows-icon-from-ico=icon.ico --company-name="VPN Guard" --product-name="VPN Guard" --file-description="VPN Guard" --file-version=1.0.0.0 --product-version=1.0.0.0 --output-filename="VPN Guard.exe" --output-dir=build vpn-guard/vpn_guard.py
          Rename-Item build/vpn_guard.dist "VPN Guard"
        shell: pwsh
      - name: Scan with Microsoft Defender (real signatures)
        shell: pwsh
        continue-on-error: true
        run: |
          try { Update-MpSignature } catch { "signature update: $_" }
          Start-MpScan -ScanType CustomScan -ScanPath "$PWD\build\VPN Guard"
          $d = Get-MpThreatDetection
          if ($d) { "DEFENDER DETECTIONS:"; $d | Format-List ThreatID, Resources, ProcessName } else { "Defender: no detections" }
      - name: Smoke test the exe
        shell: pwsh
        run: |
          $env:VPN_GUARD_HOME = "$PWD\smokeexe"
          $p = Start-Process "build/VPN Guard/VPN Guard.exe" -ArgumentList "--no-browser","--port","47666" -PassThru
          $sw = [Diagnostics.Stopwatch]::StartNew(); $up = $false
          do { Start-Sleep -Milliseconds 500; try { Invoke-RestMethod 'http://127.0.0.1:47666/api/ping' -TimeoutSec 3 | Out-Null; $up = $true } catch {} } until ($up -or $sw.Elapsed.TotalSeconds -gt 30)
          "exe: server up = $up after $($sw.Elapsed.TotalSeconds) s"
          Stop-Process $p -Force -ErrorAction SilentlyContinue
          if (-not $up) { if (Test-Path smokeexe/crash.log) { Get-Content smokeexe/crash.log }; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: VPN-Guard-exe
          path: build/VPN Guard
